<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course List</title>
  </head>
  <body>
    <h1>Course List</h1>
    <ul>
      {% for course in courses %}
      <li>
        <a href="{% url 'course_detail' course.id %}">{{ course.name }}</a> - {{
        course.price }}
      </li>
      {% endfor %}
    </ul>
    <a href="{% url 'course_create' %}">Add Course</a>
  </body>
</html>
